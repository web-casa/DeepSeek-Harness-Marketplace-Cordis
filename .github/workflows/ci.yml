name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cordis-mp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  unit-and-host-smoke:
    name: Test, build, and host smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Test workspace
        run: pnpm -r test
      - name: Build Web plugin
        run: node apps/web/scripts/build.mjs
      - name: Validate npm pack metadata
        run: pnpm run pack:check
      - name: Run host smoke
        run: node scripts/host-smoke.mjs

  dsh-integration:
    name: DSH smoke and staged-install E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install pinned DSH CLI
        run: npm install --global --ignore-scripts @deepseek-ai/dsh@0.1.0-rc.7
      - name: Record DSH CLI version
        run: dsh --version
      - name: Run DSH host smoke
        run: node scripts/dsh-smoke.mjs
      - name: Run DSH install/activate/restart E2E
        run: node scripts/dsh-e2e-install.mjs

  windows-best-effort:
    name: Windows BEST_EFFORT journal and web build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Verify journal BEST_EFFORT behavior
        # This is intentionally not the POSIX FULL crash matrix. It exercises
        # Windows' real fsync downgrade, lock fencing, and rollback semantics.
        run: node scripts/windows-best-effort.mjs
      - name: Build Web plugin
        run: node apps/web/scripts/build.mjs

# The DSH tests use the checked-in local fixture by default. Production API probing is a
# separate, explicit deployment gate because it needs a live contract-compliant endpoint.
