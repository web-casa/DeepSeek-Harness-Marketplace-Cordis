name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cordis-mp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  unit-and-host-smoke:
    name: Test, build, and host smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Test workspace
        run: pnpm -r test
      - name: Build Web plugin
        run: node apps/web/scripts/build.mjs
      - name: Validate npm pack metadata
        run: pnpm run pack:check
      - name: Run host smoke
        run: node scripts/host-smoke.mjs

  dsh-integration:
    name: DSH smoke and staged-install E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install pinned DSH CLI
        run: npm install --global --ignore-scripts @deepseek-ai/dsh@0.1.0-rc.7
      - name: Record DSH CLI version
        run: dsh --version
      - name: Run DSH host smoke
        run: node scripts/dsh-smoke.mjs
      - name: Run DSH install/activate/restart E2E
        run: node scripts/dsh-e2e-install.mjs

# The DSH tests use the checked-in local fixture by default. Production API probing is a
# separate, explicit deployment gate because it needs a live contract-compliant endpoint.
